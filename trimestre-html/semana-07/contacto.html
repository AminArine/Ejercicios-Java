<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto básico</title>
</head>
<body>
    <fieldset>
        <legend>Datos de contacto</legend>
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" placeholder="Tu nombre"><br>
            
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com"><br>
            
            
            <label for="edad">Edad</label>
            <input type="number" name="edad" min="16" max="128"><br>
    </fieldset>
    <fieldset>
        <legend>Información de acceso</legend>
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required><br>
            <label for="clave">Contraseña</label>
            <input type="password" name="clave"><br>
    </fieldset>
    <p>¿Aceptas las condiciones?</p>
    <label for="acepto">Sí, acepto las condiciones</label>
    <input type="checkbox" id="acepto" name="acepto" value="si">
    
</body>
</html>
