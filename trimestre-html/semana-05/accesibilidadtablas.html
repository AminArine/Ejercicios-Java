<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesibilidad de Tablas</title>
</head>
<body>
    <table border="1">
        <caption>Carta</caption>
        <thead>
            <tr>
                <th scope="col">Cantidad</th>
                <th scope="col">Producto</th>
                <th scope="col">Precio</th>
            </tr>
        </thead>
            <tbody>
               
                <tr>
                     <th>2</th>
                    <td>Ratón</td>
                    <td>12,50 €</td>
                </tr>
                <tr>
                    <th>1</th>
                    <td>USB-256GB</td>
                    <td>20,90 €</td>
                </tr>
                <tr>
                    <th>1</th>
                    <td>Cargador TYPE-C</td>
                    <td>34,90 €</td>
                </tr>
                <tr>
                     <th>2</th>
                    <td>Cable HDMI</td>
                    <td>4,90 €</td>
                </tr>
                <tr>
                     <th>3</th>
                    <td>Coca-Cola</td>
                    <td>0,90 €</td>
                </tr>
            </tbody>
        <tfoot>
            <tr>
                <td colspan="3">TOTAL DE  (93.30$).</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
