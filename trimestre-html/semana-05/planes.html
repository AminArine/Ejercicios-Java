
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparativa de planes</title>
</head>
<body>

    <h1>Comparativa de planes</h1>

    <table border="1">
        <tr>
            <th colspan="4">Todos los planes incluyen actualizaciones gratuitas</th>
        </tr>
        <tr>
            <th>Características</th>
            <th>Básico</th>
            <th>Estándar</th>
            <th>Premium</th>
        </tr>
        <tr>
            <th>Almacenamiento</th>
            <td>10 GB</td>
            <td>100 GB</td>
            <td>1 TB</td>
        </tr>
        <tr>
            <th>Soporte</th>
            <td>Email</td>
            <td>Chat</td>
            <td>24 horas</td>
        </tr>
        <tr>
            <th>Usuarios</th>
            <td>1 usuario</td>
            <td>5 usuarios</td>
            <td>10 usuarios</td>
        </tr>
        <tr>
            <th>Precio</th>
            <td>5 €/mes</td>
            <td>10 €/mes</td>
            <td>20 €/mes</td>
        </tr>
    </table>

</body>
</html>
