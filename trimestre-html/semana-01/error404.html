<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página con errores</title>
</head>
<body>
<h1>Bienvenido</h1>
<p>Un párrafo sin cerrar</p>
</body>

<!-- Errores
 -En primer lugar el <!DOCTYPE html> debe ir en la primera línea del documento.
 -En segundo lugar <html> habria que añadirle <html lang="es">
    -En tercer lugar hay que añadir el <meta charset="UTF-8">
    -En cuarto lugar hay error en la linea 8 ,el <h1> no tiene su etiqueta de cierre </h1>
-En quinto lugar hay error en la linea 9 ,el <p> no tiene su etiqueta de cierre </p>
-Por último hay que añadir la etiqueta de cierre </html> al final del documento. -->
