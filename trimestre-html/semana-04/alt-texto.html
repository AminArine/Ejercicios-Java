<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie de foto</title>
</head>
<body> 
     <figure>
        <img src="fotos/como.avif" alt="">
        <p>Alt vacío: solo se usa cuando la imagen es decorativa y no aporta información. </p>
       
    </figure>
     <figure>
        <img src="fotos/como.avif" alt="imagen1">
       <p>Alt malo: no describe la imagen, un lector de pantalla no sabría qué muestra.</p>
    </figure>
     <figure>
        <img src="fotos/como.avif" alt="Vistas del Lago Como, Italia">
        <figcaption>Vistas del Lago Como, Italia</figcaption>
        <p> Alt bueno: describe la imagen con claridad, útil para accesibilidad y SEO.</p>
    </figure>
</body>
</html>
